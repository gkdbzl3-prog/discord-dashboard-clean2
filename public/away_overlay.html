<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>외출 카운트다운</title>
  <!-- OBS는 투명 배경 그대로, `?mode=desktop`은 KDE에 띄우는 카드다.
       첫 페인트 전에 정해야 배경이 한 번 번쩍이지 않는다. -->
  <script>
    document.documentElement.dataset.mode =
      new URLSearchParams(location.search).get("mode") === "desktop" ? "desktop" : "obs";
  </script>
  <style>
    /* ── 폰트 바꾸는 곳 ──────────────────────────────────────
       아래 url의 파일 이름과 format 두 군데만 고치면 됩니다.
       public/fonts/ 안에 들어 있는 것:
         CallifontDaynoteJellypen-Bold.otf → format("opentype")
         OwnglyphGeungJeong.ttf            → format("truetype")
         unifont.ttf                       → format("truetype")
       새 폰트를 넣을 때도 public/fonts/ 에 두고 여기만 바꾸면 됩니다.
       ──────────────────────────────────────────────────────── */
    @font-face {
      font-family: "OverlayFont";
      src: url("/fonts/CallifontDaynoteJellypen-Bold.otf") format("opentype");
      font-display: swap;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      /* 이모지는 폰트에 없으니 뒤의 이모지 폰트가 글자별로 받아준다. */
      font-family: "OverlayFont", "Apple SD Gothic Neo", "Malgun Gothic",
                   "Noto Color Emoji", "Segoe UI Emoji", sans-serif;
      color: #ffffff;
    }

    #overlay {
      max-width: 92vw;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    #overlay[hidden] {
      display: none;
    }

    #headline {
      font-size: clamp(24px, 7vw, 42px);
      font-weight: normal;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    #countdown {
      margin-top: 8px;
      font-size: clamp(34px, 10vw, 64px);
      font-weight: normal;
      line-height: 1.15;
    }

    /* ── 여기부터 데스크톱 모드(`?mode=desktop`) ─────────────────
       OBS는 화면 위에 글자만 얹으면 되지만, 데스크톱은 벽지 위에
       홀로 뜨는 창이라 카드가 필요하다. 위 규칙은 그대로 두고
       [data-mode="desktop"] 아래에서만 덮어쓴다.
       ──────────────────────────────────────────────────────── */
    [data-mode="desktop"] {
      --ink: #f4f1ea;
      --muted: rgba(244, 241, 234, 0.55);
      --accent: #9fd8c2;
      --card: rgba(22, 24, 28, 0.82);
      --edge: rgba(244, 241, 234, 0.14);
    }

    /* 곧 나가야 하면 색이 먼저 말해준다. */
    [data-mode="desktop"][data-urgency="soon"] { --accent: #f2c879; }
    [data-mode="desktop"][data-urgency="now"] { --accent: #f09a8a; }

    [data-mode="desktop"] body {
      padding: 10px;
      box-sizing: border-box;
      background: transparent;
      color: var(--ink);
      cursor: default;
      user-select: none;
    }

    [data-mode="desktop"] #overlay {
      /* 창 어디를 잡아도 끌 수 있게. 크롬 앱 모드에서만 먹는다. */
      -webkit-app-region: drag;
      app-region: drag;
      box-sizing: border-box;
      width: 100%;
      max-width: none;
      padding: 18px 22px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--edge);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
      text-align: left;
      text-shadow: none;
    }

    /* 예정이 없어도 창은 남아야 한다. OBS처럼 숨기면 빈 창만 뜬다. */
    [data-mode="desktop"] #overlay[hidden] {
      display: flex;
    }

    /* 큰 숫자만 손글씨로 두고 작은 글씨는 또렷한 글꼴로 간다.
       손글씨체는 13~15px에서 잘 안 읽힌다. */
    [data-mode="desktop"] #reason,
    [data-mode="desktop"] #headline {
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo",
                   "Noto Color Emoji", sans-serif;
      font-variant-numeric: tabular-nums;
    }

    [data-mode="desktop"] #reason {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      letter-spacing: 0.01em;
      color: var(--muted);
      margin-bottom: 10px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* 사유가 없으면 점만 남아 고장난 것처럼 보인다. */
    [data-mode="desktop"] #reason:empty {
      display: none;
    }

    /* 예정이 없을 때는 조용해야 한다. 강조색도 큰 글씨도 쓰지 않는다. */
    [data-mode="desktop"][data-state="idle"] #countdown {
      font-size: 26px;
      color: var(--muted);
    }

    [data-mode="desktop"] #reason::before {
      content: "";
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    [data-mode="desktop"] #countdown {
      margin: 0;
      order: -1;
      font-size: 42px;
      line-height: 1.05;
      color: var(--accent);
    }

    [data-mode="desktop"] #headline {
      display: none;
    }

    [data-mode="desktop"] #overlay {
      display: flex;
      flex-direction: column;
    }

    [data-mode="desktop"] #reason { order: -2; }

    /* 데스크톱은 OBS와 달리 자리가 넉넉하니 계획을 통째로 보여준다.
       자리 비울 시각만 크게 두고 출발·도착은 아래에 붙인다. */
    [data-mode="desktop"] #schedule {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 3px 14px;
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid var(--edge);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: var(--muted);
    }

    [data-mode="desktop"] #schedule:empty {
      display: none;
    }

    /* 줄 묶음은 격자에서 사라지고 칸만 남는다. */
    [data-mode="desktop"] #schedule .row {
      display: contents;
    }

    [data-mode="desktop"] #schedule .clock {
      color: rgba(244, 241, 234, 0.72);
    }

    /* 카운트다운이 겨누는 줄. 나머지와 구별되어야 한다. */
    [data-mode="desktop"] #schedule .target .clock {
      color: var(--accent);
    }

    /* OBS에는 사유 줄도 일정 표도 없다. headline이 이미 사유를 물고 있다. */
    [data-mode="obs"] #reason,
    [data-mode="obs"] #schedule { display: none; }
  </style>
</head>
<body>
  <main id="overlay" hidden>
    <div id="reason"></div>
    <div id="headline"></div>
    <div id="countdown"></div>
    <div id="schedule"></div>
  </main>

  <script>
    const apiParam = new URLSearchParams(location.search).get("api");
    const AWAY_API_URL = apiParam ||
      (location.protocol === "http:" || location.protocol === "https:"
        ? "/api/away"
        : "http://localhost:8080/api/away");
    let latestAway = null;

    // away-countdown.js의 formatRemaining과 같은 규칙. 분이 1초마다 바뀌니
    // 서버에서 문자열을 받아둘 수 없어 여기서 직접 만든다.
    function formatRemaining(minutes) {
      const total = Math.max(0, Math.floor(Number(minutes) || 0));
      const hours = Math.floor(total / 60);
      const rest = total % 60;
      if (!hours) return `${rest}분`;
      return rest ? `${hours}시간 ${rest}분` : `${hours}시간`;
    }

    const IS_DESKTOP = document.documentElement.dataset.mode === "desktop";

    // 데스크톱 카드는 사유를 따로 쓰니 headline에서 떼어낸다.
    // OBS는 서버가 만들어 준 한 줄을 그대로 쓴다.
    function awayLines(payload) {
      if (!IS_DESKTOP) {
        return { reason: "", headline: String(payload.headline || "자리 비움") };
      }
      const awayTime = String(payload.awayTime || "").trim();
      return {
        reason: String(payload.message || "").trim(),
        headline: awayTime ? `${awayTime}에 자리 비움` : "자리 비움",
      };
    }

    function urgencyOf(minutes) {
      if (minutes <= 0) return "now";
      if (minutes <= 10) return "soon";
      return "";
    }

    // 데스크톱에만 붙는 일정 표. 같은 시각이 두 번 나오면 한 줄로 접는다.
    // (이동시간을 안 적었으면 출발과 도착이 같고, 옛 기록은 셋 다 같다.)
    function scheduleRows(payload) {
      const away = String(payload.awayTime || "").trim();
      const depart = String(payload.departTime || "").trim();
      const arrive = String(payload.arriveTime || "").trim();

      const rows = [{ label: "자리 비움", clock: away, target: true }];
      if (depart && depart !== away) rows.push({ label: "출발", clock: depart });
      if (arrive && arrive !== depart) rows.push({ label: "도착", clock: arrive });
      return rows.filter((row) => row.clock);
    }

    function renderSchedule(node, rows) {
      node.replaceChildren();
      for (const row of rows) {
        const wrap = document.createElement("div");
        wrap.className = row.target ? "row target" : "row";

        const label = document.createElement("span");
        label.textContent = row.label;

        const clock = document.createElement("span");
        clock.className = "clock";
        clock.textContent = row.clock;

        wrap.append(label, clock);
        node.append(wrap);
      }
    }

    function renderAway(payload, now = Date.now()) {
      const overlay = document.getElementById("overlay");
      const reason = document.getElementById("reason");
      const headline = document.getElementById("headline");
      const countdown = document.getElementById("countdown");
      const schedule = document.getElementById("schedule");

      if (!payload || payload.active !== true) {
        // OBS는 사라지는 게 맞고, 데스크톱은 창이 남아 있어야 하니
        // 쉬는 얼굴을 보여준다. hidden은 모드별 CSS가 갈라 받는다.
        overlay.hidden = true;
        document.documentElement.removeAttribute("data-urgency");
        document.documentElement.setAttribute("data-state", "idle");
        reason.textContent = "";
        headline.textContent = "";
        schedule.replaceChildren();
        countdown.textContent = IS_DESKTOP ? "예정 없음" : "";
        return;
      }

      const remainingMs = Math.max(0, Number(payload.targetAt) - Number(now));
      const minutes = Math.ceil(remainingMs / 60000);
      const lines = awayLines(payload);

      document.documentElement.setAttribute("data-state", "away");
      reason.textContent = lines.reason;
      headline.textContent = lines.headline;
      if (IS_DESKTOP) renderSchedule(schedule, scheduleRows(payload));
      countdown.textContent = minutes <= 0 && IS_DESKTOP
        ? "지금 나가야 해"
        : `${formatRemaining(minutes)} 남음`;

      const urgency = urgencyOf(minutes);
      if (urgency) document.documentElement.setAttribute("data-urgency", urgency);
      else document.documentElement.removeAttribute("data-urgency");

      overlay.hidden = false;
    }

    async function refreshAway() {
      try {
        const response = await fetch(AWAY_API_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`away API ${response.status}`);
        latestAway = await response.json();
        renderAway(latestAway);
      } catch (error) {
        console.warn("외출 카운트다운을 불러오지 못했어:", error);
      }
    }

    function startAwayOverlay() {
      renderAway(null);
      refreshAway();
      setInterval(() => renderAway(latestAway), 1000);
      setInterval(refreshAway, 5000);
    }

    window.addEventListener("DOMContentLoaded", startAwayOverlay);
  </script>
</body>
</html>
