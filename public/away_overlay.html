<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>외출 카운트다운</title>
  <style>
    /* ── 폰트 바꾸는 곳 ──────────────────────────────────────
       아래 url의 파일 이름과 format 두 군데만 고치면 됩니다.
       public/fonts/ 안에 들어 있는 것:
         CallifontDaynoteJellypen-Bold.otf → format("opentype")
         OwnglyphGeungJeong.ttf            → format("truetype")
         unifont.ttf                       → format("truetype")
       새 폰트를 넣을 때도 public/fonts/ 에 두고 여기만 바꾸면 됩니다.
       ──────────────────────────────────────────────────────── */
    @font-face {
      font-family: "OverlayFont";
      src: url("/fonts/CallifontDaynoteJellypen-Bold.otf") format("opentype");
      font-display: swap;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      /* 이모지는 폰트에 없으니 뒤의 이모지 폰트가 글자별로 받아준다. */
      font-family: "OverlayFont", "Apple SD Gothic Neo", "Malgun Gothic",
                   "Noto Color Emoji", "Segoe UI Emoji", sans-serif;
      color: #ffffff;
    }

    #overlay {
      max-width: 92vw;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    #overlay[hidden] {
      display: none;
    }

    #headline {
      font-size: clamp(24px, 7vw, 42px);
      font-weight: normal;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    #countdown {
      margin-top: 8px;
      font-size: clamp(34px, 10vw, 64px);
      font-weight: normal;
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <main id="overlay" hidden>
    <div id="headline"></div>
    <div id="countdown"></div>
  </main>

  <script>
    const apiParam = new URLSearchParams(location.search).get("api");
    const AWAY_API_URL = apiParam ||
      (location.protocol === "http:" || location.protocol === "https:"
        ? "/api/away"
        : "http://localhost:8080/api/away");
    let latestAway = null;

    // away-countdown.js의 formatRemaining과 같은 규칙. 분이 1초마다 바뀌니
    // 서버에서 문자열을 받아둘 수 없어 여기서 직접 만든다.
    function formatRemaining(minutes) {
      const total = Math.max(0, Math.floor(Number(minutes) || 0));
      const hours = Math.floor(total / 60);
      const rest = total % 60;
      if (!hours) return `${rest}분`;
      return rest ? `${hours}시간 ${rest}분` : `${hours}시간`;
    }

    function renderAway(payload, now = Date.now()) {
      const overlay = document.getElementById("overlay");
      const headline = document.getElementById("headline");
      const countdown = document.getElementById("countdown");

      if (!payload || payload.active !== true) {
        overlay.hidden = true;
        headline.textContent = "";
        countdown.textContent = "";
        return;
      }

      const remainingMs = Math.max(0, Number(payload.targetAt) - Number(now));
      const minutes = Math.ceil(remainingMs / 60000);
      headline.textContent = String(payload.headline || "자리 비움");
      countdown.textContent = `${formatRemaining(minutes)} 남음`;
      overlay.hidden = false;
    }

    async function refreshAway() {
      try {
        const response = await fetch(AWAY_API_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`away API ${response.status}`);
        latestAway = await response.json();
        renderAway(latestAway);
      } catch (error) {
        console.warn("외출 카운트다운을 불러오지 못했어:", error);
      }
    }

    function startAwayOverlay() {
      renderAway(null);
      refreshAway();
      setInterval(() => renderAway(latestAway), 1000);
      setInterval(refreshAway, 5000);
    }

    window.addEventListener("DOMContentLoaded", startAwayOverlay);
  </script>
</body>
</html>
